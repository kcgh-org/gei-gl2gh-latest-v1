name: GitLab to GitHub Migration Pipeline

on:
  workflow_dispatch:
    inputs:
      ENVIRONMENT_NAME:
        description: "GitHub Environment name containing migration secrets"
        type: string
        default: "gl2gh-migration-secrets"
        required: true

      APPROVAL_ENVIRONMENT_NAME:
        description: "GitHub Environment name used for manual approval"
        type: string
        default: "gl2gh-migration-approvers"
        required: true

      GITHUB_API_URL:
        description: "GitHub API URL. Use https://api.github.com for GHEC, or DR API URL for GitHub Data Residency."
        type: string
        default: "https://api.github.com"
        required: true

      INVENTORY_FILE:
        description: "Inventory file generated by gh gl2gh inventory-report"
        type: string
        default: "projects.csv"
        required: true

      RUNNER_LABEL:
        description: "Runner label"
        type: string
        default: "ubuntu-latest"
        required: true

permissions:
  contents: read
  actions: read

env:
  DEBIAN_FRONTEND: "noninteractive"
  CI_PROJECT_DIR: ${{ github.workspace }}
  INVENTORY_FILE: ${{ inputs.INVENTORY_FILE }}
  SOURCE_GL_SERVER_URL: ${{ vars.SOURCE_GL_SERVER_URL }}
  GITHUB_API_URL: ${{ inputs.GITHUB_API_URL }}

jobs:
  # ------------------------------------------------------------
  # 1) Environment Validation
  # ------------------------------------------------------------
  env-validation:
    name: env-validation
    runs-on: ${{ inputs.RUNNER_LABEL }}
    environment: ${{ inputs.ENVIRONMENT_NAME }}

    env:
      GITLAB_PAT: ${{ secrets.GITLAB_PAT }}
      GH_PAT: ${{ secrets.GH_PAT }}

      STORAGE_TYPE: ${{ vars.STORAGE_TYPE }}
      TARGET_UPLOAD_URL: ${{ vars.TARGET_UPLOAD_URL }}

      AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}

      AWS_BUCKET_NAME: ${{ vars.AWS_BUCKET_NAME }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate runtime inputs, secrets, storage, and scripts
        shell: bash
        run: |
          echo "====================================="
          echo "# 1) Environment Validation"
          echo "====================================="
          set -euo pipefail

          VALIDATION_FAILED=0

          print_ok() {
            echo "✅ $1"
          }

          print_fail() {
            echo "❌ $1"
            VALIDATION_FAILED=1
          }

          print_info() {
            echo "ℹ️  $1"
          }

          echo ""
          echo "Checking required secrets..."
          echo "----------------------------"

          if [[ -n "${GITLAB_PAT:-}" ]]; then
            print_ok "GITLAB_PAT is configured"
          else
            print_fail "GITLAB_PAT is missing in GitHub Environment secrets"
          fi

          if [[ -n "${GH_PAT:-}" ]]; then
            print_ok "GH_PAT is configured"
          else
            print_fail "GH_PAT is missing in GitHub Environment secrets"
          fi

          echo "Checking environment variables..."
          echo "--------------------------------"
          
          if [[ -n "${SOURCE_GL_SERVER_URL:-}" ]]; then
            print_ok "SOURCE_GL_SERVER_URL is configured: ${SOURCE_GL_SERVER_URL}"
          else
            print_fail "SOURCE_GL_SERVER_URL is missing in GitHub Environment variables"
          fi

          echo ""
          echo "Checking runtime inputs..."
          echo "--------------------------"

          if [[ -n "${GITHUB_API_URL:-}" ]]; then
            print_ok "GITHUB_API_URL is provided: ${GITHUB_API_URL}"
          else
            print_fail "GITHUB_API_URL is required"
          fi

          if [[ -n "${INVENTORY_FILE:-}" ]]; then
            print_ok "INVENTORY_FILE is provided: ${INVENTORY_FILE}"
          else
            print_fail "INVENTORY_FILE is required"
          fi

          echo ""
          echo "Checking GitHub API URL..."
          echo "--------------------------"

          if [[ -z "${GITHUB_API_URL:-}" ]]; then
            print_fail "GITHUB_API_URL is empty"
          elif [[ "${GITHUB_API_URL}" =~ ^https://api\.github\.com/?$ ]]; then
            print_ok "GitHub API URL is valid for GitHub Enterprise Cloud"
            print_info "Migration destination: GitHub Enterprise Cloud"
          elif [[ "${GITHUB_API_URL}" =~ ^https://api\.[a-zA-Z0-9.-]+\.ghe\.com/?$ ]]; then
            print_ok "GitHub API URL is valid for GitHub Enterprise Cloud Data Residency"
            print_info "Migration destination: GitHub Enterprise Cloud Data Residency"
          else
            print_fail "Invalid GITHUB_API_URL: ${GITHUB_API_URL}"
            print_info "Expected values:"
            print_info " - https://api.github.com"
            print_info " - https://api.<SUBDOMAIN>.ghe.com"
          fi

          echo ""
          echo "Checking inventory file..."
          echo "--------------------------"

          if [[ -n "${INVENTORY_FILE:-}" && -f "${INVENTORY_FILE}" ]]; then
            print_ok "Inventory file exists: ${INVENTORY_FILE}"
          else
            print_fail "Inventory file not found: ${INVENTORY_FILE:-not set}"
          fi

          if [[ -n "${INVENTORY_FILE:-}" && -s "${INVENTORY_FILE}" ]]; then
            print_ok "Inventory file is not empty"
          else
            print_fail "Inventory file is empty or unavailable"
          fi

          echo ""
          echo "Checking required scripts..."
          echo "----------------------------"

          if [[ -f "./1_migration_readiness_check.sh" ]]; then
            print_ok "1_migration_readiness_check.sh exists"
          else
            print_fail "1_migration_readiness_check.sh not found"
          fi

          if [[ -f "./2_migration.sh" ]]; then
            print_ok "2_migration.sh exists"
          else
            print_fail "2_migration.sh not found"
          fi

          if [[ -f "./3_post_migration_validation.sh" ]]; then
            print_ok "3_post_migration_validation.sh exists"
          else
            print_fail "3_post_migration_validation.sh not found"
          fi

          echo ""
          echo "Checking storage configuration..."
          echo "---------------------------------"

          STORAGE_TYPE="${STORAGE_TYPE:-GITHUB}"
          STORAGE_TYPE="$(echo "$STORAGE_TYPE" | tr '[:lower:]' '[:upper:]')"

          if [[ "$STORAGE_TYPE" == "GITHUB" ]]; then
            print_ok "STORAGE_TYPE is GITHUB"
            print_info "No additional storage variables are required for GitHub Storage"

          elif [[ "$STORAGE_TYPE" == "AZURE" ]]; then
            print_ok "STORAGE_TYPE is AZURE"

            if [[ -n "${AZURE_STORAGE_CONNECTION_STRING:-}" ]]; then
              print_ok "AZURE_STORAGE_CONNECTION_STRING is configured"
            else
              print_fail "AZURE_STORAGE_CONNECTION_STRING is required for STORAGE_TYPE=AZURE"
            fi

          elif [[ "$STORAGE_TYPE" == "AWS" ]]; then
            print_ok "STORAGE_TYPE is AWS"

            if [[ -n "${AWS_BUCKET_NAME:-}" ]]; then
              print_ok "AWS_BUCKET_NAME is configured: ${AWS_BUCKET_NAME}"
            else
              print_fail "AWS_BUCKET_NAME is required for STORAGE_TYPE=AWS"
            fi

            if [[ -n "${AWS_REGION:-}" ]]; then
              print_ok "AWS_REGION is configured: ${AWS_REGION}"
            else
              print_fail "AWS_REGION is required for STORAGE_TYPE=AWS"
            fi

            if [[ -n "${AWS_ACCESS_KEY_ID:-}" ]]; then
              print_ok "AWS_ACCESS_KEY_ID is configured"
            else
              print_fail "AWS_ACCESS_KEY_ID is required for STORAGE_TYPE=AWS"
            fi

            if [[ -n "${AWS_SECRET_ACCESS_KEY:-}" ]]; then
              print_ok "AWS_SECRET_ACCESS_KEY is configured"
            else
              print_fail "AWS_SECRET_ACCESS_KEY is required for STORAGE_TYPE=AWS"
            fi

            if [[ -n "${AWS_SESSION_TOKEN:-}" ]]; then
              print_ok "AWS_SESSION_TOKEN is configured"
            else
              print_info "AWS_SESSION_TOKEN is not configured. This is optional."
            fi

          else
            print_fail "Invalid STORAGE_TYPE: ${STORAGE_TYPE}. Allowed values: GITHUB, AZURE, AWS"
          fi

          echo ""
          echo "====================================="
          echo "Environment Validation Summary"
          echo "====================================="

          if [[ "$VALIDATION_FAILED" -ne 0 ]]; then
            echo "❌ Environment validation failed. Fix the errors above before continuing."
            exit 1
          fi

          echo "✅ Environment validation completed successfully."

  # ------------------------------------------------------------
  # 2) Pre-req Package Install and Validation
  # ------------------------------------------------------------
  prereq-package-install-validation:
    name: prereq-package-install-validation
    runs-on: ${{ inputs.RUNNER_LABEL }}
    environment: ${{ inputs.ENVIRONMENT_NAME }}
    needs: [env-validation]

    env:
      GH_PAT: ${{ secrets.GH_PAT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install and validate required tooling
        shell: bash
        run: |
          echo "=========================================="
          echo "# 2) Pre-req Package Install and Validation"
          echo "=========================================="
          set -euo pipefail

          echo "[INFO] Runner OS information"
          source /etc/os-release || true
          echo "[INFO] OS: ${PRETTY_NAME:-unknown}"

          HAS_SUDO="false"
          if sudo -n true >/dev/null 2>&1; then
            HAS_SUDO="true"
            echo "[INFO] Sudo access detected."
          else
            echo "[INFO] Sudo access not detected."
          fi

          REQUIRED_COMMANDS=(curl jq git python3 sed awk grep)
          MISSING_PACKAGES=()

          for cmd in "${REQUIRED_COMMANDS[@]}"; do
            if command -v "$cmd" >/dev/null 2>&1; then
              echo "[INFO] $cmd detected"
            else
              echo "[WARN] $cmd is missing"
              MISSING_PACKAGES+=("$cmd")
            fi
          done

          if [[ "${#MISSING_PACKAGES[@]}" -gt 0 ]]; then
            if [[ "$HAS_SUDO" == "true" ]]; then
              echo "[INFO] Installing missing packages: ${MISSING_PACKAGES[*]}"
              sudo apt-get update -y
              sudo apt-get install -y "${MISSING_PACKAGES[@]}"
            else
              echo "[ERROR] Missing packages and sudo access is not available:"
              printf ' - %s\n' "${MISSING_PACKAGES[@]}"
              exit 1
            fi
          fi

          if command -v gh >/dev/null 2>&1; then
            echo "[INFO] GitHub CLI detected: $(gh --version | head -n1)"
          else
            if [[ "$HAS_SUDO" == "true" ]]; then
              echo "[INFO] Installing GitHub CLI..."
              sudo mkdir -p -m 755 /etc/apt/keyrings
              curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | \
                sudo dd of=/etc/apt/keyrings/githubcli-archive-keyring.gpg
              sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | \
                sudo tee /etc/apt/sources.list.d/github-cli.list >/dev/null
              sudo apt-get update -y
              sudo apt-get install -y gh
            else
              echo "[ERROR] GitHub CLI is missing and sudo access is not available."
              exit 1
            fi
          fi

          echo "[INFO] Authenticating GitHub CLI..."

          [[ -n "${GH_PAT:-}" ]] || { echo "[ERROR] GH_PAT is required"; exit 1; }

          if [[ "${GITHUB_API_URL}" =~ ^https://api\.github\.com/?$ ]]; then
            GH_HOST="github.com"
          else
            GH_HOST="$(echo "$GITHUB_API_URL" | sed -E 's#^https://api\.##; s#/$##')"
          fi

          echo "[INFO] GH_HOST=$GH_HOST"

          unset GH_TOKEN
          echo "$GH_PAT" | gh auth login --with-token --hostname "$GH_HOST" || true
          gh auth status --hostname "$GH_HOST"

          echo "[INFO] Installing or upgrading gh-gl2gh extension..."
          gh extension install https://github.com/github/gh-gl2gh || gh extension upgrade gh-gl2gh || true

          echo "[INFO] Installed GitHub CLI extensions:"
          gh extension list

  # ------------------------------------------------------------
  # 3) Migration Readiness Check
  # ------------------------------------------------------------
  migration-readiness-check:
    name: migration-readiness-check
    runs-on: ${{ inputs.RUNNER_LABEL }}
    environment: ${{ inputs.ENVIRONMENT_NAME }}
    needs: [prereq-package-install-validation]

    env:
      SOURCE_GL_SERVER_URL: ${{ vars.SOURCE_GL_SERVER_URL }}
      INVENTORY_FILE: ${{ inputs.INVENTORY_FILE }}
      GITLAB_PAT: ${{ secrets.GITLAB_PAT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run migration readiness check
        shell: bash
        run: |
          echo "=================================="
          echo "# 3) Migration Readiness Check"
          echo "=================================="
          set -euo pipefail

          sed -i 's/\r$//' ./1_migration_readiness_check.sh
          chmod +x ./1_migration_readiness_check.sh

          ./1_migration_readiness_check.sh 2>&1 | tee 1_migration_readiness_check.out

      - name: Upload readiness artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-readiness-check-artifacts
          retention-days: 7
          path: |
            1_migration_readiness_check.out
            logs/
            output_files/
            *.log

  # ------------------------------------------------------------
  # 4) Approval Stage
  # ------------------------------------------------------------
  approval-stage:
    name: approval-stage
    runs-on: ${{ inputs.RUNNER_LABEL }}
    needs: [migration-readiness-check]
    environment:
      name: ${{ inputs.APPROVAL_ENVIRONMENT_NAME }}

    steps:
      - name: Download readiness artifacts
        uses: actions/download-artifact@v4
        with:
          name: migration-readiness-check-artifacts
          path: .

      - name: Approval notice
        shell: bash
        run: |
          echo "===================================="
          echo "MANUAL APPROVAL REQUIRED"
          echo "===================================="
          echo "Review readiness check output before approving migration."
          echo ""
          echo "Review artifact:"
          echo " - 1_migration_readiness_check.out"
          echo ""
          echo "Approve this environment deployment to continue to repository migration."

  # ------------------------------------------------------------
  # 5) Migrating Repos
  # ------------------------------------------------------------
  migrating-repos:
    name: migrating-repos
    runs-on: ${{ inputs.RUNNER_LABEL }}
    environment: ${{ inputs.ENVIRONMENT_NAME }}
    needs: [approval-stage]

    env:
      SOURCE_GL_SERVER_URL: ${{ vars.SOURCE_GL_SERVER_URL }}
      GITHUB_API_URL: ${{ inputs.GITHUB_API_URL }}
      INVENTORY_FILE: ${{ inputs.INVENTORY_FILE }}

      GITLAB_PAT: ${{ secrets.GITLAB_PAT }}
      GH_PAT: ${{ secrets.GH_PAT }}
      GH_TOKEN: ${{ secrets.GH_PAT }}

      STORAGE_TYPE: ${{ vars.STORAGE_TYPE }}
      TARGET_UPLOAD_URL: ${{ vars.TARGET_UPLOAD_URL }}

      AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}

      AWS_BUCKET_NAME: ${{ vars.AWS_BUCKET_NAME }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate GitHub CLI and install gh-gl2gh
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_API_URL}" =~ ^https://api\.github\.com/?$ ]]; then
            GH_HOST="github.com"
          else
            GH_HOST="$(echo "$GITHUB_API_URL" | sed -E 's#^https://api\.##; s#/$##')"
          fi

          echo "[INFO] GH_HOST=$GH_HOST"

          unset GH_TOKEN
          echo "$GH_PAT" | gh auth login --with-token --hostname "$GH_HOST" || true
          gh auth status --hostname "$GH_HOST"

          gh extension install https://github.com/github/gh-gl2gh || gh extension upgrade gh-gl2gh || true
          gh gl2gh install || true

      - name: Run repository migration
        shell: bash
        run: |
          echo "========================="
          echo "# 5) Migrating Repos"
          echo "========================="
          set -euo pipefail

          sed -i 's/\r$//' ./2_migration.sh
          chmod +x ./2_migration.sh

          ./2_migration.sh 2>&1 | tee 2_migration.out

          echo ""
          echo "[INFO] Generated output files:"
          find output_files -type f -maxdepth 2 -print || true

      - name: Upload migration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-artifacts
          retention-days: 7
          path: |
            2_migration.out
            output_files/
            logs/
            *.log

  # ------------------------------------------------------------
  # 6) Post Migration Validation
  # ------------------------------------------------------------
  post-migration-validation:
    name: post-migration-validation
    runs-on: ${{ inputs.RUNNER_LABEL }}
    environment: ${{ inputs.ENVIRONMENT_NAME }}
    needs: [migrating-repos]
    if: always()

    env:
      SOURCE_GL_SERVER_URL: ${{ vars.SOURCE_GL_SERVER_URL }}
      GITHUB_API_URL: ${{ inputs.GITHUB_API_URL }}

      GITLAB_PAT: ${{ secrets.GITLAB_PAT }}
      GH_PAT: ${{ secrets.GH_PAT }}
      GH_TOKEN: ${{ secrets.GH_PAT }}

      REPOS_STATUS_FILE: ${{ github.workspace }}/output_files/repos_with_status.csv

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download migration artifacts
        uses: actions/download-artifact@v4
        with:
          name: migration-artifacts
          path: .

      - name: Authenticate GitHub CLI
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_API_URL}" =~ ^https://api\.github\.com/?$ ]]; then
            GH_HOST="github.com"
          else
            GH_HOST="$(echo "$GITHUB_API_URL" | sed -E 's#^https://api\.##; s#/$##')"
          fi

          echo "[INFO] GH_HOST=$GH_HOST"

          unset GH_TOKEN
          echo "$GH_PAT" | gh auth login --with-token --hostname "$GH_HOST" || true
          gh auth status --hostname "$GH_HOST"

      - name: Run post-migration validation
        shell: bash
        run: |
          echo "================================"
          echo "# 6) Post Migration Validation"
          echo "================================"
          set -euo pipefail

          if [[ ! -f "$REPOS_STATUS_FILE" ]]; then
            echo "[ERROR] repos_with_status.csv not found: $REPOS_STATUS_FILE"
            echo "[INFO] Available files:"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          sed -i 's/\r$//' ./3_post_migration_validation.sh
          chmod +x ./3_post_migration_validation.sh

          ./3_post_migration_validation.sh 2>&1 | tee 3_post_migration_validation.out

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-migration-validation-artifacts
          retention-days: 7
          path: |
            3_post_migration_validation.out
            output_files/
            logs/
            *.log
